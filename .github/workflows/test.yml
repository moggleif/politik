# Kör beräkningstesterna och kontrollerna av den färdiga webbplatsen.
# Python-jobbet är snabbt och fångar räknefel, osynkade datafiler och
# sidor vars meny eller sidfot hamnat i otakt med de andras;
# webbplatsjobbet fångar trasiga länkar, JavaScript-fel och sidor som
# inte längre ritar sina diagram.
#
# Båda jobben inleds med sin granskare – ruff respektive ESLint. De
# fångar det testerna aldrig ser: oanvända variabler, skuggade namn och
# grenar som inte går att nå. Verktygen är pinnade, så att en ny
# version inte gör CI rött utan att någon ändrat en rad kod.
#
# Facit-kontrollen jämför varje sidas färdigritade utfall mot ett
# incheckat facit, och interaktionstesterna använder sidorna: de ställer
# om varje reglage, delar länken och trycker bakåt. Båda körs mot fryst
# fixturdata i tests/fixtures/, inte mot docs/data-*.json – annars vore de
# röda inom ett dygn, eftersom förtidsröstjobbet skriver om sina datafiler
# två gånger om dagen. Rök-testet kör däremot mot de riktiga filerna, för
# det är dess uppgift att upptäcka ett trasigt databygge.
name: Tester

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  berakningar:
    name: Beräkningar och datafiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Installera beroenden
        run: pip install -r requirements.txt "ruff==0.15.*"
      - name: Granska Python (ruff)
        run: ruff check
      - name: Kör testsviten
        run: python3 -m unittest discover tests
      - name: Kontrollera interna länkar och lokala källfiler
        run: python3 scripts/kontrollera_lankar.py
      - name: Kontrollera att alla sidor har samma meny och sidfot
        run: python3 scripts/bygg_sidmall.py --kontrollera

  webbplats:
    name: Webbplatsens sidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript-syntax
        run: |
          for f in docs/*.js; do node --check "$f"; done
      - name: Enhetstesta de delade byggstenarna
        run: node --test tests/*.js
      - name: Installera kontrollverktyg
        run: |
          npm install --no-save eslint@9 playwright@1.49 html-validate@9 axe-core@4
          npx playwright install --with-deps chromium
      - name: Granska JavaScript (ESLint)
        run: npx eslint
      - name: Validera HTML
        run: npx html-validate docs/*.html
      - name: Rök-testa alla sidor
        run: node scripts/smoke_webbplats.js
      - name: Facit över sidornas renderade utfall
        run: node scripts/facit_webbplats.js
      - name: Reglage, adressrad, bakåt och framåt
        run: node scripts/interaktion_webbplats.js
      - name: Tillgänglighet (axe, tangentbord, smal skärm)
        run: node scripts/tillganglighet.js
