# Hämtar Valmyndighetens mottagna förtidsröster två gånger om dagen under
# förtidsröstningen 2026 och bygger om sidans datafiler (en per kommun,
# län och riket). Valmyndigheten uppdaterar filen kl. 06 och 14 svensk tid
# (CEST = UTC+2 i september), så jobbet går kl. 04.40 och 12.40 UTC.
# Committar bara när innehållet faktiskt ändrats: hämtskriptet skriver
# inte om filen om datat är oförändrat, och tidsstämpeln i hamtad.json
# anger därför när datat senast ändrades.
#
# Pushen till main går inte med jobbets inbyggda GITHUB_TOKEN: repots
# regeluppsättning "Main rules" kräver pull request och CodeQL-resultat,
# och pull requests som skapas med den inbyggda tokenen startar inga
# tester eller CodeQL. Jobbet pushar därför med en personlig token från
# repots ägare (secret FORTIDSROSTER_TOKEN: fine-grained PAT för bara
# det här repot, Contents: read and write), och ägaren står i
# regeluppsättningens bypass-lista (Repository admin, Always allow).
# Eftersom pushen görs med en PAT startar testerna och CodeQL på
# datacommiten som vanligt. Saknas secreten hämtar och bygger jobbet
# ändå, men varnar och faller på pushen.
name: Förtidsröster

on:
  schedule:
    - cron: "40 4,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fortidsroster
  cancel-in-progress: false

jobs:
  hamta:
    name: Hämta och bygg om
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # Tokenen sparas i git-konfigurationen och används vid pushen
          token: ${{ secrets.FORTIDSROSTER_TOKEN || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Siffrorna kan justeras fram till den 16 september 2026; därefter
      # finns inget nytt att hämta, och jobbet avslutas utan att göra något
      # tills schemat tas bort. Manuell körning går alltid.
      - name: Är förtidsröstningen fortfarande aktuell?
        id: aktuell
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%Y-%m-%d)" \< "2026-09-18" ]; then
            echo "kor=ja" >> "$GITHUB_OUTPUT"
          else
            echo "Förtidsröstningen 2026 är avslutad och siffrorna slutliga; inget att hämta."
            echo "kor=nej" >> "$GITHUB_OUTPUT"
          fi
      - name: Hämta Valmyndighetens fil
        if: steps.aktuell.outputs.kor == 'ja'
        run: python3 scripts/hamta_fortidsroster.py
      - name: Bygg om sidans datafil
        if: steps.aktuell.outputs.kor == 'ja'
        run: python3 scripts/build_fortidsroster.py
      - name: Kontrollräkna
        if: steps.aktuell.outputs.kor == 'ja'
        run: python3 -m unittest tests.test_berakningar -k Fortidsroster
      - name: Finns tokenen som får pusha till main?
        if: steps.aktuell.outputs.kor == 'ja'
        env:
          TOKEN_SATT: ${{ secrets.FORTIDSROSTER_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SATT" != "true" ]; then
            echo "::warning::Secreten FORTIDSROSTER_TOKEN saknas. Pushen till main stoppas av regeluppsättningen (pull request krävs); se kommentaren överst i arbetsflödet."
          fi
      - name: Committa om något ändrats
        if: steps.aktuell.outputs.kor == 'ja'
        run: |
          git add -A data/fortidsroster docs/data-fortidsroster
          if git diff --cached --quiet; then
            echo "Inga ändringar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Förtidsröster: $(python3 -c "import json;d=json.load(open('docs/data-fortidsroster/00.json'));v=d['val'][str(d['aktuellt'])];print(f\"{v['total']} röster i riket t.o.m. {v['dagar'][-1]['datum']}\")")"
          git push origin HEAD:main
